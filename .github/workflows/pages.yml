# Publishes this fork to GitHub Pages: https://srivastavakumarpratik.github.io/openGym/
#
# Pages serves static files only, so this build has no openGym server. VITE_GH_SYNC=1 makes the
# app keep the profile in a private GitHub repository instead (frontend/src/lib/gh-sync.js): each
# device connects once with a fine-grained token that can only read and write that repository.
# The exercise stills and animations (180 px) come from catalogue/media and are staged next to
# the build by scripts/catalogue/stage-media.mjs, so they are served from this site, unmodified.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'catalogue/**'
      - 'scripts/catalogue/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_GH_SYNC: '1'
          VITE_GH_REPO: srivastavakumarpratik/opengym-data
      # The 180 px stills and animations from catalogue/media, served next to the demo
      - run: node scripts/catalogue/stage-media.mjs frontend/dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
